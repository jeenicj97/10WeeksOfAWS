name: AWS OIDC Challenge
on: workflow_dispatch
permissions:
  id-token: write
  contents: read
jobs:
  test-aws-oidc:
    runs-on: ubuntu-latest
    steps:
      - name: Debug OIDC token
        run: |
              JWT=$(curl -sSL -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
              PAYLOAD=$(echo "$JWT" | cut -d '.' -f2)
              PAYLOAD="${PAYLOAD}$(printf '%*s' $(( (4 - ${#PAYLOAD} % 4) % 4 )) | tr ' ' '=')"
              echo "$PAYLOAD" | base64 -d | jq '{sub, aud, repository, repository_owner}'
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::118167167207:role/github-oidc-challenge-role
          aws-region: ap-south-1
      - run: aws sts get-caller-identity
      - run: aws s3 ls
